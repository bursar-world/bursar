[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# Bursar's own contracts are built with 0.8.24, as every release so far. The vendored Privacy Pools
# code pins 0.8.28, the compiler its audits covered, and so does everything that imports it.
auto_detect_solc = true
# Pinned, because Forge's default moves with its releases. Cancun is the target of every deployed
# 0.8.24 contract, and tests and scripts run on it too. The 0.8.28 set was built and deployed for
# Prague and stays there through the `prague` profile; nothing in it needs a Prague opcode.
evm_version = "cancun"
additional_compiler_profiles = [{ name = "prague", evm_version = "prague" }]
compilation_restrictions = [
    # All of src/ except src/shielded/, so a new contract gets 0.8.24 rather than the newest compiler
    # its pragma allows. Globs have no negation, so each alternative matches the paths that diverge
    # from "shielded/" at one position.
    { paths = "src/{[!s],s[!h],sh[!i],shi[!e],shie[!l],shiel[!d],shield[!e],shielde[!d],shielded[!/]}*", version = "=0.8.24" },
    { paths = "vendor/privacy-pools-core/**", version = "=0.8.28", evm_version = "prague" },
    { paths = "src/shielded/**", version = "=0.8.28", evm_version = "prague" },
    # Tests, scripts and libraries build with whichever of the two their imports need, never with a
    # newer compiler that happens to be installed.
    { paths = "**", version = ">=0.8.24, <=0.8.28" },
]
optimizer = true
optimizer_runs = 200
ffi = false
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
# Only remappings.txt. Detected remappings depend on which nested submodules a `forge install` pulls
# in, and every remapping lands in the metadata hash, so a detected one makes CI and a laptop build
# different bytecode (and move every CREATE2 address a fixture was proven for).
auto_detect_remappings = false

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 32
fail_on_revert = false

# The lints fire thousands of times across tests and vendored patterns, which buries real compiler
# warnings on every build. Run `forge lint` on its own when you want them.
[lint]
lint_on_build = false

[fmt]
# Generated by snarkjs from circuits/build/within_mandate.zkey; its hash is pinned in circuits/build/setup.json.
ignore = ["src/zk/*", "vendor/**"]
