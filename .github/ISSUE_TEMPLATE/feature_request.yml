name: Feature request
description: Propose a change to what Bursar can do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For an open-ended idea, [start a discussion](https://github.com/bursar-world/bursar/discussions) first. A request that changes contract behaviour or a protocol parameter also needs a governance proposal on chain; see GOVERNANCE.md.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: The change you would like, and how someone would use it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, including doing nothing.
  - type: dropdown
    id: scope
    attributes:
      label: Does it touch deployed contracts or funds?
      options:
        - "No"
        - "Yes, it changes contract behaviour or a parameter"
        - "Not sure"
    validations:
      required: true
