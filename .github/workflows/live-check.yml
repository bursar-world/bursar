name: Live check

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  check:
    name: Check the live deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # contracts/.foundry-version pins the release; the contracts README installs from it too.
      - name: Read the pinned Foundry release
        id: foundry
        run: echo "version=$(cat .foundry-version)" >> "$GITHUB_OUTPUT"

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ steps.foundry.outputs.version }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # contracts/lib is not committed. The same three dependencies, by commit, as the CI workflow
      # and the contracts README install.
      - name: Install Solidity dependencies
        run: |
          forge install --no-git --shallow \
            foundry-rs/forge-std@1eea5bae12ae557d589f9f0f0edae2faa47cb262 \
            OpenZeppelin/openzeppelin-contracts@69c8def5f222ff96f2b5beff05dfba996368aa79 \
            OpenZeppelin/openzeppelin-contracts-upgradeable@723f8cab09cdae1aca9ec9cc1cfa040c2d4b06c1

      # Reads the chain and Sourcify, holds no key and sends nothing. The report is the job summary,
      # and the step fails when the chain disagrees with the live record.
      - name: Check the live record against the chain
        run: |
          status=0
          script/check-live.sh > "$RUNNER_TEMP/live-check.md" || status=$?
          cat "$RUNNER_TEMP/live-check.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
