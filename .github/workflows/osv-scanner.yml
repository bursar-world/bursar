name: OSV-Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '53 6 * * 4'

permissions:
  contents: read

concurrency:
  group: osv-scanner-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Scan the lockfile for known vulnerabilities and malicious packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release binary rather than google/osv-scanner-action. The action is a container pulled
      # by a tag that can be moved; the checksum published with the release pins these bytes.
      - name: Install osv-scanner
        env:
          VERSION: 2.6.0
          SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${VERSION}/osv-scanner_linux_amd64"
          echo "${SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"

      # The lockfile alone: exactly what pnpm install --frozen-lockfile puts on disk.
      # OSV includes the malicious-packages feed (MAL advisories), so a compromised release fails.
      - name: Scan pnpm-lock.yaml
        run: '"$RUNNER_TEMP/osv-scanner" scan source --lockfile pnpm-lock.yaml'
