          python -m pip install --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/slither-requirements.txt"
          slither --version

      # slither.config.json scopes the detectors to src/ and fails the run on any High or Medium
      # finding. docs/STATIC-ANALYSIS.md lists the detectors that are off and why.
      - name: Run Slither
        run: slither . --sarif results.sarif

      # Uploaded whether or not the run passed, so a failing run shows its findings in code
      # scanning as well as in the log. A run that could not build writes no file and skips this.
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: ${{ !cancelled() && hashFiles('contracts/results.sarif') != '' }}
        with:
          sarif_file: contracts/results.sarif
          category: slither
