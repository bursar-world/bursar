name: Slither

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - contracts/**
      - .github/workflows/slither.yml
  schedule:
    - cron: '37 4 * * 5'

permissions:
  contents: read

concurrency:
  group: slither-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Static analysis of the contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The findings are published to code scanning as SARIF.
      security-events: write
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same Foundry release and the same three dependencies, at the same commits, as the
      # contracts job in ci.yml, so Slither analyses the build CI tests.
      - name: Read the pinned Foundry release
        id: foundry
        run: echo "version=$(cat .foundry-version)" >> "$GITHUB_OUTPUT"

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ steps.foundry.outputs.version }}

      - name: Install Solidity dependencies
        run: |
          forge install --no-git --shallow \
            foundry-rs/forge-std@1eea5bae12ae557d589f9f0f0edae2faa47cb262 \
            OpenZeppelin/openzeppelin-contracts@69c8def5f222ff96f2b5beff05dfba996368aa79 \
            OpenZeppelin/openzeppelin-contracts-upgradeable@723f8cab09cdae1aca9ec9cc1cfa040c2d4b06c1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # slither-analyzer and everything it pulls in, each pinned to a version and to the sha256 of
      # the wheels pip can pick on this runner (CPython 3.12 on x86_64 Linux). The set was resolved
      # with `uv pip compile --python-version 3.12 --python-platform x86_64-manylinux_2_28` from
      # `slither-analyzer==0.11.6`, and the hashes are the ones PyPI publishes. A new Slither
      # release is a new list.
