name: Monitor

# Reads the live deployment on chain 4663 once an hour and fails on any alert, so the failed run is
# the page when no webhook is configured. docs/RUNBOOK.md says what each line means.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Live deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The monitor needs viem alone, which @bursar/core declares.
      - run: pnpm install --frozen-lockfile --filter @bursar/core

      # The previous run's balances, which this run's are compared against. A cache entry is never
      # rewritten, so each run saves under its own key and the next restores the newest one by prefix.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/monitor-state.json
          key: monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: monitor-state-

      # RHC_RPC_URL is tried before the public endpoints when set. The webhook receives warnings
      # and alerts. FACILITATOR_GAS_FLOAT is the facilitator relayer's address, which the record
      # does not carry; unset, that one check is skipped.
      - run: node contracts/script/monitor.mjs
        env:
          RHC_RPC_URL: ${{ secrets.RHC_RPC_URL }}
          BURSAR_ALERT_WEBHOOK: ${{ secrets.BURSAR_ALERT_WEBHOOK }}
          FACILITATOR_GAS_FLOAT: ${{ vars.FACILITATOR_GAS_FLOAT }}
          BURSAR_MONITOR_STATE: ${{ runner.temp }}/monitor-state.json

      # Saved whether or not the run alerted, so the next run compares against this one.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: ${{ runner.temp }}/monitor-state.json
          key: monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
