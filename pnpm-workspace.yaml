packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'

# tsx and vitest both bundle esbuild, which unpacks a platform binary in a postinstall step.
# Without this, a fresh clone installs an esbuild that cannot run.
#
# The three that are off are optional native speed-ups pulled in by the wallet connectors. Each
# ships a JavaScript fallback, so compiling them buys nothing and a missing toolchain would fail
# the install.
allowBuilds:
  esbuild: true
  bufferutil: false
  keccak: false
  utf-8-validate: false
onlyBuiltDependencies:
  - esbuild
