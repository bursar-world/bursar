packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'
  - 'templates/*'
  - 'circuits'

# tsx and vitest both bundle esbuild, which unpacks a platform binary in a postinstall step.
# Without this, a fresh clone installs an esbuild that cannot run.
#
# The three that are off are optional native speed-ups pulled in by the wallet connectors. Each
# ships a JavaScript fallback, so compiling them buys nothing and a missing toolchain would fail
# the install.
allowBuilds:
  esbuild: true
  workerd: true
  bufferutil: false
  keccak: false
  utf-8-validate: false
onlyBuiltDependencies:
  - esbuild
  - workerd

# A compromised release is usually noticed and pulled from the registry within hours. A new version
# is not installed until it has been public for three days, which outlasts that window for every
# dependency, transitive ones included. Dependabot's cooldown in .github/dependabot.yml is the same
# three days, so an update it proposes is one this setting will accept.
minimumReleaseAge: 4320

# Security fixes for packages that arrive through something else, where whatever pulls them in pins
# a vulnerable release. Each version key matches only the vulnerable range, so an entry does
# nothing once its parent moves past it, and can then be deleted.
overrides:
  # @coinbase/cdp-sdk, under wagmi's Base Account connector, pins 1.16.0.
  'axios@<1.18.0': ^1.18.0
  # next pins 8.4.31 for its own CSS pipeline.
  'postcss@<8.5.23': ^8.5.23
  # snarkjs reaches it through bfj and jsonpath, which pins 1.13.6.
  'underscore@<1.13.8': ^1.13.8
  # The MetaMask SDK and utils ask for 8 and 9 and call only v4() and validate(), which 11 keeps.
  'uuid@<11.1.1': ^11.1.1
  # ethers, under @zk-kit/lean-imt, pins 8.17.1; the viem inside WalletConnect 2.21 pins 8.18.0.
  'ws@>=8.0.0 <8.21.0': ^8.21.0
  # WalletConnect 2.21 declares query-string and never loads it. The fix for its
  # decode-uri-component is ESM only and query-string 7 cannot require() it, so the unused package
  # goes instead. wagmi 2's connectors pin WalletConnect 2.21; 2.22 dropped query-string.
  '@walletconnect/utils>query-string': '-'
